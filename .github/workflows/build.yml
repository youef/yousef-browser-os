name: Build YOUSEF Browser OS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build bootable image
        run: |
          chmod +x build-image.sh
          sudo ./build-image.sh

      - name: Validate image
        run: |
          set -euxo pipefail
          test -f YOUSEF-Browser-OS.img
          test "$(stat -c%s YOUSEF-Browser-OS.img)" -eq 4294967296
          sudo fdisk -l YOUSEF-Browser-OS.img
          file YOUSEF-Browser-OS.img
          sudo dd if=YOUSEF-Browser-OS.img bs=512 count=1 status=none | od -An -tx1 | grep -q '55 aa'

      - name: Generate checksum
        run: sha256sum YOUSEF-Browser-OS.img > YOUSEF-Browser-OS.img.sha256

      - name: Upload IMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUSEF-Browser-OS-x86_64-${{ github.run_number }}
          path: |
            YOUSEF-Browser-OS.img
            YOUSEF-Browser-OS.img.sha256
          retention-days: 30
          compression-level: 0

      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YOUSEF Browser OS build ${{ github.run_number }}
          body: x86_64 BIOS raw IMG for UTM SE; Firefox ESR kiosk mode.
          files: |
            YOUSEF-Browser-OS.img
            YOUSEF-Browser-OS.img.sha256
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
